{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card p-4">

<h2 class="text-center">

<i class="bi bi-shield-lock"></i>

Admin Login

</h2>

<form method="POST">

<div class="mb-3">

<label>Username</label>

<input
    type="text"
    name="username"
    class="form-control"
    required>

</div>


<div class="mb-3">

<label>Password</label>

<input
    type="password"
    name="password"
    class="form-control"
    required>

</div>


<button class="btn btn-primary w-100">

<i class="bi bi-box-arrow-in-right"></i>

Admin Login

</button>

</form>

</div>

</div>

</div>

{% endblock %}
