{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card p-4">

<h2 class="text-center mb-4">
    <i class="bi bi-person-plus"></i>
    Create Account
</h2>

<form method="POST">

<div class="mb-3">

<label>Username</label>

<input
    type="text"
    name="username"
    class="form-control"
    required>

</div>


<div class="mb-3">

<label>Email</label>

<input
    type="email"
    name="email"
    class="form-control"
    required>

</div>


<div class="mb-3">

<label>Password</label>

<input
    type="password"
    name="password"
    class="form-control"
    required>

</div>


<button
    class="btn btn-primary w-100">

    <i class="bi bi-person-check"></i>
    Register

</button>

</form>

</div>

</div>

</div>

{% endblock %}
