{% extends "base.html" %}

{% block content %}

<div class="card p-4">

<h2>
    <i class="bi bi-person-circle"></i>
    My Profile
</h2>

<hr>

<p>
<strong>Username:</strong>
{{ user["username"] }}
</p>

<p>
<strong>Email:</strong>
{{ user["email"] }}
</p>

<p>

<strong>Voting Status:</strong>

{% if user["has_voted"] %}

<span class="badge bg-success">
    Vote Submitted
</span>

{% else %}

<span class="badge bg-warning text-dark">
    Not Voted
</span>

{% endif %}

</p>

</div>

{% endblock %}
